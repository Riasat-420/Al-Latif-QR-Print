<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QR Print Dashboard — manage print jobs, view stats, reprint and review job history.">
  <title>QR Print Dashboard</title>

  <!-- Google Fonts: Inter & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/dashboard.css?v=2.5">
</head>
<body>

  <!-- ════════ LOGIN SCREEN ════════ -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">🖨️</div>
      <h1>QR Print Dashboard</h1>
      <p>Enter your admin password to continue.</p>
      <form id="loginForm">
        <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
        <button type="submit" class="btn btn-primary">Log In</button>
      </form>
      <div id="loginError" class="login-error" style="display:none;"></div>
    </div>
  </div>

  <!-- ════════ MAIN DASHBOARD ════════ -->
  <div id="dashboardMain" class="dashboard-main" style="display: none;">

    <!-- Header -->
    <header class="dash-header">
      <div class="dash-header-left">
        <span class="dash-logo">🖨️</span>
        <h1 id="dashShopName">Al-Latif Print Dashboard</h1>
      </div>
      <button id="logoutBtn" class="btn btn-ghost">Logout</button>
    </header>

    <!-- Stats Bar -->
    <section class="stats-bar" id="statsBar">
      <div class="stat-card">
        <div class="stat-value" id="statPrintedToday">—</div>
        <div class="stat-label">Printed Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statPrintedWeek">—</div>
        <div class="stat-label">This Week</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statPrintedTotal">—</div>
        <div class="stat-label">All Time</div>
      </div>
      <div class="stat-card stat-pending">
        <div class="stat-value" id="statPending">—</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card stat-failed">
        <div class="stat-value" id="statFailed">—</div>
        <div class="stat-label">Failed</div>
      </div>
      <div class="stat-card stat-rejected">
        <div class="stat-value" id="statRejected">—</div>
        <div class="stat-label">Rejected</div>
      </div>
    </section>

    <!-- Filters -->
    <section class="filters-bar">
      <div class="filter-group">
        <label>Status</label>
        <select id="filterStatus">
          <option value="">All</option>
          <option value="pending">Pending</option>
          <option value="accepted">Accepted</option>
          <option value="printed">Printed</option>
          <option value="rejected">Rejected</option>
          <option value="failed">Failed</option>
          <option value="expired">Expired</option>
        </select>
      </div>
      <div class="filter-group">
        <label>From</label>
        <input type="date" id="filterFrom">
      </div>
      <div class="filter-group">
        <label>To</label>
        <input type="date" id="filterTo">
      </div>
      <button id="filterApply" class="btn btn-primary btn-sm">Apply</button>
      <button id="filterReset" class="btn btn-ghost btn-sm">Reset</button>
    </section>

    <!-- Job List -->
    <section class="job-list-section">
      <div id="jobList" class="job-list">
        <div class="job-list-empty">Loading jobs…</div>
      </div>

      <!-- Pagination -->
      <div id="pagination" class="pagination" style="display: none;">
        <button id="prevPage" class="btn btn-ghost btn-sm">← Prev</button>
        <span id="pageInfo" class="page-info">Page 1 of 1</span>
        <button id="nextPage" class="btn btn-ghost btn-sm">Next →</button>
      </div>
    </section>

    <!-- Job Detail Modal -->
    <div id="jobModal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <button id="modalClose" class="modal-close">×</button>
        <img id="modalImage" class="modal-image" alt="Job preview">
        <div class="modal-details">
          <div class="modal-row"><span>Job ID</span><span id="modalId">—</span></div>
          <div class="modal-row"><span>Status</span><span id="modalStatus">—</span></div>
          <div class="modal-row"><span>Size</span><span id="modalSize">—</span></div>
          <div class="modal-row"><span>Paper</span><span id="modalPaper">—</span></div>
          <div class="modal-row"><span>Color</span><span id="modalColor">—</span></div>
          <div class="modal-row"><span>Copies</span><span id="modalCopies">—</span></div>
          <div class="modal-row"><span>Created</span><span id="modalCreated">—</span></div>
          <div class="modal-row"><span>Printed</span><span id="modalPrinted">—</span></div>
        </div>
        <div class="modal-actions">
          <button id="modalReprint" class="btn btn-primary btn-sm">🔄 Reprint</button>
          <button id="modalDelete" class="btn btn-danger btn-sm">🗑️ Delete</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/auth.js?v=2.5"></script>
  <script src="js/stats.js?v=2.5"></script>
  <script src="js/jobs.js?v=2.5"></script>
  <script src="js/actions.js?v=2.5"></script>
</body>
</html>

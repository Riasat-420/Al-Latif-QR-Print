<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Al-Latif Print Agent — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f0f0f;
      color: #fdfdfd;
      padding: 24px;
      user-select: none;
      background-image: radial-gradient(circle at 90% 10%, rgba(255, 77, 0, 0.08) 0%, transparent 40%);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .logo { font-size: 24px; filter: drop-shadow(0 0 10px rgba(255, 77, 0, 0.3)); }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 40%, #ffa985);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.sub { font-size: 12px; color: #a3a3a3; margin-bottom: 20px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #a3a3a3;
      margin: 14px 0 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 10px 14px;
      background: #171717;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fdfdfd;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      border-color: #ff4d00;
      box-shadow: 0 0 0 2px rgba(255, 77, 0, 0.25);
    }
    select { appearance: none; cursor: pointer; }
    .btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #ff4d00, #d63200);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 77, 0, 0.28);
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn:hover { box-shadow: 0 6px 20px rgba(255, 77, 0, 0.38); }
    .btn:active { transform: scale(0.98); }
    #status {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: none;
    }
    #status.ok { display: block; background: rgba(2, 122, 72, 0.15); color: #10b981; border: 1px solid rgba(2, 122, 72, 0.3); }
    #status.err { display: block; background: rgba(220, 38, 38, 0.15); color: #ef4444; border: 1px solid rgba(220, 38, 38, 0.3); }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🖨️</span>
    <h1>Al-Latif Print Agent</h1>
  </div>
  <p class="sub">Configure connection to Al-Latif Print Cloud Server.</p>

  <label>Server URL</label>
  <input id="serverUrl" placeholder="https://print.allatifsofts.com">

  <label>Agent Key</label>
  <input id="agentKey" placeholder="Paste your shop secret agent key">

  <label>Printer</label>
  <select id="printerSelect"><option value="">(default printer)</option></select>

  <label>Poll Interval (ms)</label>
  <input id="pollInterval" type="number" value="5000" min="1000" max="30000" step="1000">

  <button class="btn" id="saveBtn">Save & Connect</button>
  <div id="status"></div>

  <script>
    const { ipcRenderer } = require('electron');

    const $ = id => document.getElementById(id);

    // Load saved settings
    (async () => {
      const settings = await ipcRenderer.invoke('get-settings');
      $('serverUrl').value = settings.serverUrl || 'https://print.allatifsofts.com';
      $('agentKey').value = settings.agentKey || '567129787f740f9ca2d03555591ca5fada5c1d90cf25ee07';
      $('pollInterval').value = settings.pollInterval || 5000;

      // Load printers
      const printerData = await ipcRenderer.invoke('get-printers');
      const sel = $('printerSelect');
      (printerData.printers || []).forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = p.name + (p.name === printerData.default ? ' (default)' : '');
        sel.appendChild(opt);
      });
      if (settings.printer) sel.value = settings.printer;
    })();

    // Save
    $('saveBtn').addEventListener('click', async () => {
      const statusEl = $('status');
      statusEl.style.display = 'none';

      const settings = {
        serverUrl: $('serverUrl').value.trim().replace(/\/$/, ''),
        agentKey: $('agentKey').value.trim(),
        printer: $('printerSelect').value,
        pollInterval: parseInt($('pollInterval').value) || 5000,
      };

      if (!settings.serverUrl) {
        statusEl.className = 'err';
        statusEl.textContent = 'Server URL is required.';
        return;
      }
      if (!settings.agentKey) {
        statusEl.className = 'err';
        statusEl.textContent = 'Agent Key is required.';
        return;
      }

      const result = await ipcRenderer.invoke('save-settings', settings);
      statusEl.className = 'ok';
      statusEl.textContent = '✅ Connected! Polling for new print jobs.';
    });
  </script>
</body>
</html>

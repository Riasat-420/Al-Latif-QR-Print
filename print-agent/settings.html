<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Print Agent — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: #1a1b2e;
      color: #e2e8f0;
      padding: 24px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #818cf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.sub { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin: 14px 0 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 10px 14px;
      background: #111827;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #6366f1; }
    select { appearance: none; cursor: pointer; }
    .btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: box-shadow 0.2s;
    }
    .btn:hover { box-shadow: 0 0 20px rgba(99,102,241,0.3); }
    .btn:active { transform: scale(0.98); }
    #status {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: none;
    }
    #status.ok { display: block; background: rgba(16,185,129,0.12); color: #10b981; border: 1px solid rgba(16,185,129,0.2); }
    #status.err { display: block; background: rgba(239,68,68,0.12); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
  </style>
</head>
<body>
  <h1>⚙️ QR Print Agent</h1>
  <p class="sub">Configure your connection to the print server.</p>

  <label>Server URL</label>
  <input id="serverUrl" placeholder="https://yourdomain.com">

  <label>Agent Key</label>
  <input id="agentKey" placeholder="Paste the agent key from the seed script">

  <label>Printer</label>
  <select id="printerSelect"><option value="">(default printer)</option></select>

  <label>Poll Interval (ms)</label>
  <input id="pollInterval" type="number" value="5000" min="1000" max="30000" step="1000">

  <button class="btn" id="saveBtn">Save & Connect</button>
  <div id="status"></div>

  <script>
    const { ipcRenderer } = require('electron');

    const $ = id => document.getElementById(id);

    // Load saved settings
    (async () => {
      const settings = await ipcRenderer.invoke('get-settings');
      $('serverUrl').value = settings.serverUrl || '';
      $('agentKey').value = settings.agentKey || '';
      $('pollInterval').value = settings.pollInterval || 5000;

      // Load printers
      const printerData = await ipcRenderer.invoke('get-printers');
      const sel = $('printerSelect');
      (printerData.printers || []).forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = p.name + (p.name === printerData.default ? ' (default)' : '');
        sel.appendChild(opt);
      });
      if (settings.printer) sel.value = settings.printer;
    })();

    // Save
    $('saveBtn').addEventListener('click', async () => {
      const statusEl = $('status');
      statusEl.style.display = 'none';

      const settings = {
        serverUrl: $('serverUrl').value.trim().replace(/\/$/, ''),
        agentKey: $('agentKey').value.trim(),
        printer: $('printerSelect').value,
        pollInterval: parseInt($('pollInterval').value) || 5000,
      };

      if (!settings.serverUrl) {
        statusEl.className = 'err';
        statusEl.textContent = 'Server URL is required.';
        return;
      }
      if (!settings.agentKey) {
        statusEl.className = 'err';
        statusEl.textContent = 'Agent Key is required.';
        return;
      }

      const result = await ipcRenderer.invoke('save-settings', settings);
      statusEl.className = 'ok';
      statusEl.textContent = '✅ Settings saved! Polling started.';
    });
  </script>
</body>
</html>
